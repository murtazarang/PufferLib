[base]
package = mujoco
env_name = HalfCheetah-v5 Hopper-v5 Swimmer-v5 Walker2d-v5 Ant-v5 Humanoid-v5 Reacher-v5 InvertedPendulum-v5 InvertedDoublePendulum-v5 Pusher-v5 HumanoidStandup-v5
policy_name = Policy
rnn_name = Recurrent

[env]
render_mode = rgb_array

[vec]
num_envs = 512
num_workers = 16
batch_size = auto

[train]
total_timesteps = 5_000_000
learning_rate = 3e-4
gamma = 0.99
gae_lambda = 0.95
update_epochs = 10
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.0
checkpoint_interval = 200
batch_size = 32768
minibatch_size = 4096
bptt_horizon = 64
